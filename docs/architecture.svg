<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#464646"/><stop offset="1" stop-color="#121212"/></linearGradient>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Phone -->
  <rect x="20" y="20" width="360" height="480" rx="14" fill="#f4f6f9" stroke="#9aa4b2"/>
  <rect x="20" y="20" width="360" height="40" rx="14" fill="url(#hd)"/>
  <rect x="20" y="46" width="360" height="14" fill="#121212"/>
  <text x="200" y="46" fill="#fff" font-weight="700" font-size="15" text-anchor="middle">BlackBerry Bold 9780 · OS 6</text>

  <rect x="40" y="76" width="320" height="250" rx="8" fill="#fff" stroke="#2a8ce8"/>
  <text x="200" y="98" font-weight="700" text-anchor="middle" fill="#1f69c9">bbtube MIDlet (MIDP 2.0 / CLDC 1.1)</text>
  <rect x="56" y="110" width="288" height="40" rx="5" fill="#eaf3fd" stroke="#bcd6f3"/>
  <text x="200" y="127" text-anchor="middle" font-weight="600">Screen (Canvas)</text>
  <text x="200" y="143" text-anchor="middle" fill="#555" font-size="12">Home · Results · Video · Preview Frames</text>
  <rect x="56" y="158" width="288" height="40" rx="5" fill="#eaf3fd" stroke="#bcd6f3"/>
  <text x="200" y="175" text-anchor="middle" font-weight="600">VideoScreen (Canvas) + MMAPI Player</text>
  <text x="200" y="191" text-anchor="middle" fill="#555" font-size="12">direct video · control bar · seek ±10 s</text>
  <rect x="56" y="206" width="138" height="40" rx="5" fill="#eaf3fd" stroke="#bcd6f3"/>
  <text x="125" y="223" text-anchor="middle" font-weight="600">Options (Form)</text>
  <text x="125" y="239" text-anchor="middle" fill="#555" font-size="12">server address</text>
  <rect x="206" y="206" width="138" height="40" rx="5" fill="#eaf3fd" stroke="#bcd6f3"/>
  <text x="275" y="223" text-anchor="middle" font-weight="600">RecordStore</text>
  <text x="275" y="239" text-anchor="middle" fill="#555" font-size="12">server · recent searches</text>
  <rect x="56" y="254" width="288" height="56" rx="5" fill="#fafafa" stroke="#ddd"/>
  <text x="200" y="272" text-anchor="middle" font-weight="600">get() · background threads</text>
  <text x="200" y="288" text-anchor="middle" fill="#555" font-size="12">HttpConnection + ";interface=wifi"</text>
  <text x="200" y="303" text-anchor="middle" fill="#555" font-size="12">tab-separated text · JPEG thumbnails</text>

  <rect x="40" y="342" width="320" height="64" rx="8" fill="#fff" stroke="#9aa4b2"/>
  <text x="200" y="364" text-anchor="middle" font-weight="700">BlackBerry Browser → Media Player</text>
  <text x="200" y="382" text-anchor="middle" fill="#555" font-size="12">"Play in Media Player" via platformRequest</text>
  <text x="200" y="397" text-anchor="middle" fill="#555" font-size="12">(inside Display.callSerially)</text>

  <rect x="40" y="420" width="320" height="64" rx="8" fill="#fff" stroke="#9aa4b2"/>
  <text x="200" y="442" text-anchor="middle" font-weight="700">Install over the air</text>
  <text x="200" y="460" text-anchor="middle" fill="#555" font-size="12">Browser opens /app/bbtube.jad, downloads bbtube.jar</text>
  <text x="200" y="475" text-anchor="middle" fill="#555" font-size="12">BBTube-Server attribute = Mac address</text>

  <!-- Mac -->
  <rect x="540" y="20" width="400" height="390" rx="14" fill="#f4f6f9" stroke="#9aa4b2"/>
  <text x="740" y="46" font-weight="700" font-size="15" text-anchor="middle">Mac · bbtube.py :8090 (Python stdlib)</text>
  <g font-size="12">
    <rect x="560" y="62" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="81" font-weight="600">/app/bbtube.jad|jar</text><text x="912" y="81" fill="#555" text-anchor="end">install files</text>
    <rect x="560" y="98" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="117" font-weight="600">/api/search · /api/video</text><text x="912" y="117" fill="#555" text-anchor="end">search, video info (TSV)</text>
    <rect x="560" y="134" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="153" font-weight="600">/api/thumb · /frame</text><text x="912" y="153" fill="#555" text-anchor="end">JPEG + length badge</text>
    <rect x="560" y="170" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="189" font-weight="600">/api/play</text><text x="912" y="189" fill="#555" text-anchor="end">conversion state</text>
    <rect x="560" y="206" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="225" font-weight="600">/v/ID.mp4</text><text x="912" y="225" fill="#555" text-anchor="end">MP4 with Range (206)</text>
    <rect x="560" y="242" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="261" font-weight="600">/log</text><text x="912" y="261" fill="#555" text-anchor="end">phone log</text>
    <rect x="560" y="278" width="360" height="30" rx="5" fill="#fff" stroke="#ccd"/>
    <text x="572" y="297" font-weight="600">/ · /search · /watch · /play</text><text x="912" y="297" fill="#555" text-anchor="end">web version</text>
  </g>
  <rect x="560" y="320" width="360" height="74" rx="8" fill="#fff4e5" stroke="#e8b46a"/>
  <text x="740" y="341" text-anchor="middle" font-weight="700">ffmpeg conversion (≤ 2 at once)</text>
  <text x="740" y="359" text-anchor="middle" fill="#555" font-size="12">itag 18 (H.264 Main) → H.264 Baseline 3.0 ≤ 480×360</text>
  <text x="740" y="375" text-anchor="middle" fill="#555" font-size="12">AAC 128k, loudnorm −16 LUFS / −3 dBTP (aac_at)</text>
  <text x="740" y="389" text-anchor="middle" fill="#555" font-size="12">cache/ keeps the last 10 · -progress → %</text>

  <!-- Invidious -->
  <rect x="540" y="430" width="400" height="70" rx="14" fill="#eef7ee" stroke="#7fb47f"/>
  <text x="740" y="456" text-anchor="middle" font-weight="700" font-size="15">Invidious :3000 (Docker)</text>
  <text x="740" y="476" text-anchor="middle" fill="#555" font-size="12">search · video info · storyboards · thumbnails · stream proxy</text>
  <text x="740" y="491" text-anchor="middle" fill="#555" font-size="12">→ YouTube</text>

  <!-- arrows -->
  <line x1="362" y1="282" x2="536" y2="128" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="455" y="112" text-anchor="middle" fill="#333" font-size="12" font-weight="600">Wi‑Fi · HTTP</text>
  <line x1="346" y1="178" x2="536" y2="221" stroke="#2a8ce8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="480" y="236" text-anchor="middle" fill="#1f69c9" font-size="12">video stream</text>
  <line x1="362" y1="374" x2="536" y2="293" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="740" y1="410" x2="740" y2="428" stroke="#555" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
